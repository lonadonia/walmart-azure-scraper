# The automated canary: the first recorded result page of every run is checked before collection goes
# on. A failure stops the run (CANARY_CHECK_FAILED) and holds the store until `release-hold`.
canary:
  enabled: true
  min_valid_records: 1
  min_valid_ratio: 0.05
  source_check: true               # every valid record equal to the page's own item data

# The store's verified products are kept indefinitely (collection/retention.py): one shown later only with a
# shipping or marketplace offer, or without a line for the store, keeps its identity with empty prices (never
# that price); one a run does not observe is carried forward unchanged from its last verified observation,
# with its own crawl date, its age and the reason. There is no age limit (max_age_days must stay null).
historical:
  enabled: true
  max_age_days: null

# A complete, validated, non-pilot run becomes the store's published dataset (published/<store>/latest.json).
publish:
  auto: true
  accept_warnings_reason: null     # publish runs with WARN findings only with a recorded reason
