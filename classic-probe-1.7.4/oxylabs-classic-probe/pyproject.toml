[project]
name = "oxylabs-classic-probe"
version = "1.7.4"
description = "A small offline probe and request plan for the Oxylabs Classic Web Scraper API (Realtime): documented payloads, response checks and a durable shared campaign ledger. Its live mode is disabled."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "selectolax>=1.0.1,<2",  # the vendored Walmart page reader's HTML parser (the collector's version)
]

[project.scripts]
classic-probe = "classic_probe.cli:entrypoint"

[dependency-groups]
dev = [
    # The Walmart collector's locked versions.
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classic_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["src/classic_probe/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S110"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = "classic_probe.vendor.*"
ignore_errors = true
