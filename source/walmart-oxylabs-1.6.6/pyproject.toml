[project]
name = "walmart-azure-headless"
version = "1.6.6"
description = "Headless Walmart store-price collector: Scrape.do's Walmart store endpoint or the Oxylabs Web API, PostgreSQL, Azure Container Apps jobs or one Linux VM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3.21",
    "python-ulid>=3.0",
    "httpx>=0.27",
    "azure-storage-blob>=12.23",
    "azure-identity>=1.19",
    "tzdata>=2024.2",
]

[project.scripts]
walmart-collector = "walmart_headless.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0",
    "pgserver==0.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walmart_headless"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs PostgreSQL (a temporary pgserver instance, or WALMART_COLLECTOR_TEST_DATABASE_URL)",
    "captures: replays authentic Walmart pages captured by earlier live runs (offline)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/walmart_headless/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["walmart_headless"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["src/walmart_headless/migrations/"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "azure.*", "ulid.*", "pgserver.*"]
ignore_missing_imports = true
